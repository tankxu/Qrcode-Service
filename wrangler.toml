name = "qrcode-service"
main = "worker/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/*"]

[dev]
port = 8787

# Hourly sweep that fires expiry-countdown notifications. See worker/lib/expiry.ts.
[triggers]
crons = ["5 * * * *"]

[[routes]]
pattern = "app.pandaqr.xyz"
custom_domain = true

# Legacy domain — Worker handles 301 redirect to pandaqr.xyz / app.pandaqr.xyz.
# See worker/index.ts top middleware.
[[routes]]
pattern = "qrcode-service.tankxu.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "qrcode-service-db"
database_id = "1aa84840-adf5-4333-98b3-d45a92bd49e1"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "qrcode-service-images"

[[kv_namespaces]]
binding = "CACHE"
id = "6d7a1d45cd6d4f9ebfbc8bac392a6f6e"

# Analytics Engine left out for MVP — sparkline runs off D1 scan_daily.
# Enable at https://dash.cloudflare.com/<account>/workers/analytics-engine
# and re-add this block when needed:
# [[analytics_engine_datasets]]
# binding = "SCAN_EVENTS"
# dataset = "qrcode_scans"
